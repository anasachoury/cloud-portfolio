<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Portfolio Shop</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1420; color: #e6e8ee;
  }
  main { width: min(720px, 100%); padding: 40px 20px; }
  h1 { font-size: 1.6rem; } h1 span { color: #5ea2ff; }
  h2 { font-size: 1.05rem; color: #9aa3b5; text-transform: uppercase; letter-spacing: .08em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin: 16px 0 32px; }
  .card { background: #1a2233; border: 1px solid #2a3550; border-radius: 10px; padding: 16px; }
  .card .name { font-weight: 600; margin-bottom: 6px; }
  .card .price { color: #5ea2ff; font-variant-numeric: tabular-nums; }
  form { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; background: #1a2233; border: 1px solid #2a3550; border-radius: 10px; padding: 16px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: #9aa3b5; }
  select, input { background: #0f1420; color: inherit; border: 1px solid #2a3550; border-radius: 6px; padding: 8px; min-width: 160px; }
  button { background: #5ea2ff; color: #0f1420; font-weight: 700; border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  button:hover { background: #7fb3ff; }
  #msg { margin-top: 10px; font-size: .85rem; min-height: 1.2em; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #2a3550; }
  th { color: #9aa3b5; font-weight: 500; }
  td.num { font-variant-numeric: tabular-nums; }
  .empty { color: #9aa3b5; font-size: .9rem; }
  footer { margin-top: 48px; color: #565f73; font-size: .78rem; }
</style>
</head>
<body>
<main>
  <h1>cloud<span>portfolio</span> shop</h1>
  <p>Demo storefront served by nginx, fronting FastAPI services on EKS.</p>

  <h2>Products <span id="p-status"></span></h2>
  <div class="grid" id="products"></div>

  <h2>New order</h2>
  <form id="order-form">
    <label>Product
      <select id="product" required></select>
    </label>
    <label>Quantity
      <input id="quantity" type="number" min="1" value="1" required>
    </label>
    <button type="submit">Place order</button>
  </form>
  <div id="msg"></div>

  <h2>Recent orders</h2>
  <div id="orders" class="empty">loading…</div>

  <footer>frontend → ingress-nginx → products / orders → redis · gitops-managed</footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const money = (n) => n.toFixed(2) + " €";

async function loadProducts() {
  try {
    const res = await fetch("/api/products/");
    if (!res.ok) throw new Error(res.status);
    const products = await res.json();
    $("p-status").textContent = "";
    $("products").innerHTML = products.map(p =>
      `<div class="card"><div class="name">${p.name}</div><div class="price">${money(p.price)}</div></div>`
    ).join("");
    $("product").innerHTML = products.map(p =>
      `<option value="${p.id}">${p.name} — ${money(p.price)}</option>`
    ).join("");
  } catch {
    $("p-status").textContent = "(unavailable)";
    $("products").innerHTML = `<div class="empty">products service unreachable</div>`;
  }
}

async function loadOrders() {
  try {
    const res = await fetch("/api/orders/");
    if (!res.ok) throw new Error(res.status);
    const orders = await res.json();
    if (!orders.length) { $("orders").textContent = "no orders yet"; return; }
    $("orders").innerHTML = `<table>
      <tr><th>#</th><th>product</th><th>qty</th><th>total</th><th>placed</th></tr>
      ${orders.map(o => `<tr><td class="num">${o.id}</td><td>${o.product_name}</td>
        <td class="num">${o.quantity}</td><td class="num">${money(o.total_price)}</td>
        <td>${o.created_at.slice(0, 19).replace("T", " ")}</td></tr>`).join("")}
    </table>`;
  } catch {
    $("orders").textContent = "orders service unreachable";
  }
}

$("order-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = {
    product_id: Number($("product").value),
    quantity: Number($("quantity").value),
  };
  try {
    const res = await fetch("/api/orders/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || res.status);
    $("msg").textContent = `✓ order #${body.id} placed — ${money(body.total_price)}`;
    loadOrders();
  } catch (err) {
    $("msg").textContent = `✗ ${err.message}`;
  }
});

loadProducts();
loadOrders();
</script>
</body>
</html>
