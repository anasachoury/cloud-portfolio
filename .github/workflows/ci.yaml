name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; individual jobs elevate only what they need.
permissions:
  contents: read

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── gate 1: secrets in git history, SAST, IaC + dependency CVEs ──────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0               # gitleaks scans full history

      - name: gitleaks (hardcoded secrets)
        uses: gitleaks/gitleaks-action@4036f303133f36c5017e03c31446353f31572e9e # v2.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # org/private repos also need GITLEAKS_LICENSE (see its README);
          # personal public repo: works without a license

      - name: semgrep (SAST)
        run: pip install semgrep && semgrep scan --config auto --error

      - name: trivy (IaC + dependencies)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true    # without this, unfixed distro CVEs break main at random, weeks later

  # ── gate 2: render the chart per service, validate against k8s schemas ──
  validate-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install helm + kubeconform (pinned, checksummed)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          echo "fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179  /tmp/helm.tgz" | sha256sum -c
          tar -C /tmp -xzf /tmp/helm.tgz
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

          curl -fsSL -o /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tgz" | sha256sum -c
          tar -C /tmp -xzf /tmp/kubeconform.tgz kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/
      - name: helm template + kubeconform per service
        run: |
          set -euo pipefail
          for svc in frontend products orders; do
            echo "== $svc"
            helm template "$svc" charts/microservice -f "gitops/apps/$svc/values.yaml" > "/tmp/$svc.yaml"
            kubeconform -strict -summary -ignore-missing-schemas "/tmp/$svc.yaml"
          done

  # ── gate 3: test, build, scan the image; push to ECR only on main ───────
  build-push:
    needs: [security-scan, validate-charts]
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC federation — no stored AWS keys anywhere
      contents: read
    strategy:
      fail-fast: false     # see all three scan reports, not just the first failure
      matrix:
        service: [frontend, products, orders]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Unit tests
        if: matrix.service != 'frontend'
        run: |
          pip install \
            -r "services/${{ matrix.service }}/requirements.txt" \
            -r "services/${{ matrix.service }}/requirements-dev.txt"
          pytest "services/${{ matrix.service }}"

      # AWS steps run only when the account side exists: set the repo
      # variable DEPLOY_READY=true (Settings > Secrets and variables > Actions
      # > Variables) once terraform/persistent (ECR + OIDC role) is applied
      # and ACCOUNT_ID below is replaced with the real one.
      - name: Configure AWS credentials (deploy mode only)
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_READY == 'true'
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/github-ci
          aws-region: eu-west-1

      - name: ECR login (deploy mode only)
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_READY == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build
        run: docker build -t "${{ matrix.service }}:${{ github.sha }}" "services/${{ matrix.service }}"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Push (deploy mode only)
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_READY == 'true'
        run: |
          IMG="${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}"
          docker tag "${{ matrix.service }}:${{ github.sha }}" "$IMG"
          docker push "$IMG"

  # ── after the matrix: ONE job bumps all tags and pushes ONE commit.
  #    This is the race fix: parallel jobs never touch git, and CI still
  #    never touches the cluster — it only pushes images and commits tags. ──
  update-manifests:
    needs: build-push
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_READY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install yq (pinned, checksummed)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  /tmp/yq" | sha256sum -c
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
      - name: Bump all image tags, push one commit
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for svc in frontend products orders; do
            yq -i '.image.tag = strenv(SHA)' "gitops/apps/$svc/values.yaml"
          done
          git config user.name  "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${SHA}"
          # no [skip ci] needed: pushes made with GITHUB_TOKEN never trigger
          # workflows (GitHub guarantee), so this commit will not loop CI
          git pull --rebase origin main
          git push
