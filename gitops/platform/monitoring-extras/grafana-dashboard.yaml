# gitops/platform/monitoring-extras/grafana-dashboard.yaml
# Generated by scripts/generate_dashboard.py — regenerate, don't hand-edit
# (the JSON is embedded as a literal block; Grafana's sidecar loads any
# ConfigMap labeled grafana_dashboard: "1" — chart values confirmed in
# kube-prometheus-stack 92.10.1: label grafana_dashboard, value "1").
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Portfolio
data:
  portfolio.json: |
    {
      "uid": "portfolio-services",
      "title": "Portfolio \u2014 traffic & autoscaling",
      "tags": [
        "portfolio"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS",
            "label": "Prometheus",
            "type": "datasource",
            "query": {
              "query": "prometheus"
            },
            "current": {},
            "refresh": 1,
            "allowCustomValue": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate",
          "description": "Requests per second per service (products, orders). Drive it through the frontend: /api/products, /api/orders.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "a",
              "expr": "sum by (job) (rate(http_requests_total[5m]))",
              "legendFormat": "{{job}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "5xx error ratio",
          "description": "Share of responses with 5xx status (instrumentator groups statuses: 2xx, 5xx). Threshold at 5% matches the FastAPIHighErrorRate alert. Gaps = no traffic.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "refId": "a",
              "expr": "100 * sum by (job) (rate(http_requests_total{status=\"5xx\"}[5m])) / sum by (job) (rate(http_requests_total[5m]))",
              "legendFormat": "{{job}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "p95 latency",
          "description": "p95 request latency from the unlabelled high-resolution histogram (http_request_duration_highr_seconds).",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "refId": "a",
              "expr": "histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_highr_seconds_bucket[5m])))",
              "legendFormat": "{{job}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HPA replicas",
          "description": "Autoscaler story: current catches up to desired; desired pinned at max for 10m fires HPAMaxedOut.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "refId": "a",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas",
              "legendFormat": "current {{horizontalpodautoscaler}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            },
            {
              "refId": "b",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas",
              "legendFormat": "desired {{horizontalpodautoscaler}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            },
            {
              "refId": "c",
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas",
              "legendFormat": "max {{horizontalpodautoscaler}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Container restarts (15m)",
          "description": "Kill a pod (kubectl -n products delete pod -l ...), watch it land here as the deployment replaces it.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 8
          },
          "targets": [
            {
              "refId": "a",
              "expr": "sum by (namespace) (increase(kube_pod_container_status_restarts_total{namespace=~\"products|orders\"}[15m]))",
              "legendFormat": "{{namespace}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Pods up",
          "description": "Live pod count per service (each scraped pod contributes an up==1 series). Drops during scale events and outages.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 8
          },
          "targets": [
            {
              "refId": "a",
              "expr": "sum by (job) (up{job=~\"(products|orders)/.*\"})",
              "legendFormat": "{{job}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          }
        }
      ]
    }
