# gitops/apps-root/kube-prometheus-stack.yaml
# Prometheus Operator + Grafana + Alertmanager + default dashboards/rules.
# ServerSideApply matters here: this chart ships very large CRDs and
# client-side apply can blow past object size limits without it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "92.10.1"
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/gitops/platform/monitoring-values.yaml
    - repoURL: https://github.com/anasachoury/cloud-portfolio.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
