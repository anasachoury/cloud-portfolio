# gitops/apps-root/redis.yaml
# Plain-manifest Application (no Helm): source points at a directory of
# manifests, one resource per service — kept intentionally tiny.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/anasachoury/cloud-portfolio.git
    targetRevision: main
    path: gitops/platform/redis
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
