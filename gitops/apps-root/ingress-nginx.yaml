# gitops/apps-root/ingress-nginx.yaml
# One Service of type LoadBalancer -> one AWS load balancer for the whole
# cluster. On EKS without aws-load-balancer-controller the legacy in-tree
# provisioner creates a Classic ELB; an NLB would need the controller and
# service annotations (optional polish, similar cost at this scale).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: "4.15.1"
      helm:
        releaseName: ingress-nginx
        valueFiles:
          - $values/gitops/platform/ingress-nginx.yaml
    - repoURL: https://github.com/anasachoury/cloud-portfolio.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
