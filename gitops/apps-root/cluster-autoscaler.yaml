# gitops/apps-root/cluster-autoscaler.yaml
# Adds/removes nodes when pods are Pending or nodes are underutilized.
# PREREQUISITES:
#   1. terraform/cluster/autoscaler-iam.tf applied — the IRSA role ARN goes
#      into gitops/platform/cluster-autoscaler.yaml (without it the
#      autoscaler starts but cannot touch the ASG)
#   2. The chart's appVersion must match your EKS cluster's MINOR version —
#      check the kubernetes/autoscaler release notes when you bump this.
#   3. terraform-aws-modules/eks already tags the node groups for
#      auto-discovery; no extra tags needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/autoscaler
      chart: cluster-autoscaler
      targetRevision: "9.59.0"
      helm:
        releaseName: cluster-autoscaler
        valueFiles:
          - $values/gitops/platform/cluster-autoscaler.yaml
    - repoURL: https://github.com/anasachoury/cloud-portfolio.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
