# gitops/apps/orders/values.yaml
image:
  repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/orders
  tag: "latest"          # CI's update-manifests job rewrites this line

env:
  - name: PYTHONDONTWRITEBYTECODE
    value: "1"
  - name: PRODUCTS_URL
    value: http://products.products.svc.cluster.local
  - name: REDIS_URL
    value: redis.redis.svc.cluster.local:6379

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

networkPolicy:
  enabled: true
  # orders is only called by the frontend (ingress-nginx + frontend peer)
  ingressPeers:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: frontend}
      podSelector:
        matchLabels: {app.kubernetes.io/instance: frontend}
  # orders talks to products and redis
  egressPeers:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: products}
      podSelector:
        matchLabels: {app.kubernetes.io/instance: products}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: redis}
